{% extends "base.html" %}

    <h1 class="text-xl font-semibold tracking-tight text-marca-900">Listo</h1>
    <p class="mt-2 text-sm text-slate-600">
      Tu contraseña quedó guardada. Ya puedes entrar con tu correo.

      Entrar

{% endblock %}
