# Entorno local reproducible (TT-02, DT-37).
#
# El stack entero: PostgreSQL (DT-1), SeaweedFS con su bucket (DT-18, DT-38),
# Mailpit para el correo (DEC-18), la aplicación Django y el compilador de
# estilos. Desde un clon limpio, sin `.env` y sin nada instalado salvo Docker:
#
#   docker compose up            # o `up -d` para dejarlo en segundo plano
#
# y la aplicación está en http://localhost:8000, migrada y sembrada.
#
# Apagar:                          docker compose down
# Borrar todo, datos incluidos:    docker compose down -v
# Un comando dentro:               docker compose exec app python manage.py …
#
# ESTE FICHERO TIENE QUE LEVANTAR SIEMPRE, EN CUALQUIER MÁQUINA. Si un cambio
# añade una variable de entorno obligatoria, un servicio, un paso de arranque o
# una dependencia del sistema, se refleja aquí —o en el `Dockerfile`— en el
# mismo PR. Lo vigilan `config/tests_contenedor.py` y el flujo
# `integracion-continua` de la CI, que levanta esto mismo desde cero.

name: smartfood

# Lo que comparten `app` y `estilos`: la misma imagen, el mismo código y los
# mismos ajustes. Las dos cargan Django, y Django no arranca sin ellos.
x-aplicacion: &aplicacion
  image: smartfood-aplicacion
  # Tu usuario, no root: lo que escribe en el repositorio —las hojas
  # compiladas— tiene que poder tocarlo tu `uv run` después. Si tu usuario no
  # es el 1000, pon UID y GID en `.env` (`id -u`, `id -g`).
  user: "${UID:-1000}:${GID:-1000}"
  restart: unless-stopped
  volumes:
    - .:/app
  environment:
    # Credenciales ficticias que solo valen contra estos contenedores.
    DJANGO_SECRET_KEY: clave-solo-para-desarrollo-local-no-usar-fuera-de-aqui
    DJANGO_DEBUG: "True"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    # Por la red de compose: `postgres` y `seaweedfs` son nombres de servicio, no
    # `localhost`, que dentro del contenedor es el propio contenedor.
    DATABASE_URL: postgres://${POSTGRES_USER:-smartfood}:${POSTGRES_PASSWORD:-smartfood-local}@postgres:5432/${POSTGRES_DB:-smartfood}
    # Conexiones NO persistentes. `runserver` atiende cada petición en un hilo
    # nuevo, y con conexiones persistentes cada hilo deja la suya abierta al
    # morir: el healthcheck, cada 5 s, agotaba las 100 de PostgreSQL en unos
    # veinte minutos y todo lo demás recibía «too many clients already».
    DJANGO_CONN_MAX_AGE: "0"
    # Al Mailpit del compose (DEC-18): recibe todo el correo y no entrega nada
    # fuera de la máquina. Para probar contra un buzón real, otro EMAIL_URL.
    EMAIL_URL: smtp://mailpit:1025
    DJANGO_DEFAULT_FROM_EMAIL: SmartFood <onboarding@resend.dev>
    S3_ENDPOINT_URL: http://seaweedfs:8333
    # El navegador no resuelve `seaweedfs`: las URL firmadas de las fotografías se
    # firman contra el puerto publicado (config/almacenamiento.py, DT-37).
    S3_ENDPOINT_URL_PUBLICO: http://localhost:${S3_PORT:-9000}
    S3_BUCKET: ${S3_BUCKET:-smartfood}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smartfood}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smartfood-local}
    S3_REGION: auto
    S3_ADDRESSING_STYLE: path
    # `sembrar` no tiene contraseña por defecto en el código (DEC-11): se la
    # da este fichero, y es la de `[S2.1]` de docs/desarrollo.md. Vacía, no
    # siembra.
    SEMBRAR_CONTRASENA: ${SEMBRAR_CONTRASENA-smartfood-local-2026}
    SEMBRAR_ESTUDIANTES: ${SEMBRAR_ESTUDIANTES:-12}

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: smartfood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartfood}
      POSTGRES_USER: ${POSTGRES_USER:-smartfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartfood-local}
      # Comparaciones y ordenación en español, que es el idioma de los datos.
      POSTGRES_INITDB_ARGS: "--locale=es_CO.UTF-8 --encoding=UTF8"
      LANG: es_CO.utf8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartfood} -d ${POSTGRES_DB:-smartfood}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Almacenamiento de objetos compatible con S3 (DT-18, DT-38). SeaweedFS y no
  # MinIO: las imágenes de MinIO dejaron de publicarse y ningún clon nuevo
  # podía descargarlas. Un solo proceso hace de maestro, volumen, filer y API S3.
  #
  # La identidad se escribe al arrancar desde las variables: el fichero de
  # credenciales de SeaweedFS no lee el entorno. Sin identidad anónima, todo
  # acceso sin firma recibe 403: el bucket es privado sin hacer nada más.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: smartfood-seaweedfs
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smartfood}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smartfood-local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"smartfood","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Write","Tagging"]}]}' \
          "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "${S3_PORT:-9000}:8333"   # API S3
    volumes:
      - seaweedfs-datos:/data
    healthcheck:
      # 127.0.0.1 y no `localhost`: dentro del contenedor `localhost` resuelve
      # primero a ::1, SeaweedFS solo escucha en IPv4, y el servicio se daría
      # por caído con el API respondiendo.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Crea el bucket y sale (TT-50). Sin esto, cada integrante tendría que crearlo
  # a mano y el entorno dejaría de ser reproducible.
  #
  # UN bucket con dos prefijos, `privado/` y `publico/`, no dos buckets (DT-21):
  # la topología que el código espera, y la que se replica aquí por paridad de
  # control de acceso (DT-18).
  almacenamiento-inicializar:
    image: chrislusf/seaweedfs:4.48
    container_name: smartfood-almacenamiento-inicializar
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      BUCKET: ${S3_BUCKET:-smartfood}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        listar() { echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 2>/dev/null | awk '{print $$1}'; }
        if listar | grep -qx "$$BUCKET"; then
          echo "Bucket $$BUCKET ya existía."
        else
          echo "s3.bucket.create -name $$BUCKET" | weed shell -master=seaweedfs:9333
          listar | grep -qx "$$BUCKET"
          echo "Bucket $$BUCKET creado, privado."
        fi
    restart: "no"

  # Servidor de correo de desarrollo (DEC-18). Captura todo lo que el sistema
  # envía —invitaciones, recuperación de contraseña— y lo enseña en
  # http://localhost:8025. No entrega nada fuera de la máquina, así que la carga
  # masiva puede invitar a direcciones ficticias sin rebotes (DEC-9 ya no aplica).
  #
  # SOLO en 127.0.0.1, los dos puertos: la interfaz lista los enlaces de
  # invitación, que son credenciales (DEC-3), y no puede verlos otra máquina de
  # la red. El SMTP se publica para el modo sin contenedor (`uv run`).
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: smartfood-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"        # interfaz web
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Compila las dos hojas de Tailwind (DT-36) y se queda vigilando las
  # plantillas. Es el `tailwind watch` de la segunda terminal, ya abierto.
  estilos:
    <<: *aplicacion
    container_name: smartfood-estilos
    # La imagen la construye `app`, que siempre se construye antes de crear
    # ningún contenedor. Construirla aquí también la etiquetaría dos veces con
    # etiquetas de servicio distintas: la imagen cambiaría en cada `up` según
    # cuál terminara último, y los contenedores se recrearían sin motivo.
    pull_policy: never
    command: ["bash", "docker/vigilar-estilos.sh"]
    healthcheck:
      # Listo cuando las dos hojas están compiladas: antes, la aplicación se
      # serviría sin estilos y parecería un fallo de Tailwind que no lo es.
      test: ["CMD", "test", "-f", "/tmp/estilos-listos"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 5s

  # La aplicación: migra, sincroniza los permisos, siembra y sirve (DT-37).
  # El repositorio va montado encima de /app, así que un cambio en el código
  # recarga `runserver` sin reconstruir nada.
  app:
    <<: *aplicacion
    container_name: smartfood-app
    command: ["sh", "docker/arrancar-aplicacion.sh"]
    build: .
    # Reconstruye en cada `up`. Con la caché de capas tarda un par de segundos
    # si nada cambió, y es lo que impide levantar una imagen vieja después de
    # un `git pull` que añadió una dependencia a `uv.lock`.
    #
    # Nada de `build.provenance` ni de otra clave reciente: los Compose 2 no
    # la conocen y rechazan el fichero ENTERO. La CI lo valida con v2.20.3.
    pull_policy: build
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      almacenamiento-inicializar:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      estilos:
        condition: service_healthy
    healthcheck:
      # `/salud/` comprueba que la base contesta, no solo que el proceso vive
      # (TT-04). El primer arranque siembra y tarda: de ahí el margen.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/salud/', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  postgres-datos:
  seaweedfs-datos:
