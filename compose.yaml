# Entorno local reproducible (TT-02, DT-37).
#
# El stack entero: PostgreSQL (DT-1), MinIO con su bucket (DT-18), la aplicación
# Django y el compilador de estilos. Desde un clon limpio, sin `.env` y sin nada
# instalado salvo Docker:
#
#   docker compose up            # o `up -d` para dejarlo en segundo plano
#
# y la aplicación está en http://localhost:8000, migrada y sembrada.
#
# Apagar:                          docker compose down
# Borrar todo, datos incluidos:    docker compose down -v
# Un comando dentro:               docker compose exec app python manage.py …
#
# ESTE FICHERO TIENE QUE LEVANTAR SIEMPRE, EN CUALQUIER MÁQUINA. Si un cambio
# añade una variable de entorno obligatoria, un servicio, un paso de arranque o
# una dependencia del sistema, se refleja aquí —o en el `Dockerfile`— en el
# mismo PR. Lo vigilan `config/tests_contenedor.py` y el flujo
# `integracion-continua` de la CI, que levanta esto mismo desde cero.

name: smartfood

# Lo que comparten `app` y `estilos`: la misma imagen, el mismo código y los
# mismos ajustes. Las dos cargan Django, y Django no arranca sin ellos.
x-aplicacion: &aplicacion
  image: smartfood-aplicacion
  # Tu usuario, no root: lo que escribe en el repositorio —las hojas
  # compiladas— tiene que poder tocarlo tu `uv run` después. Si tu usuario no
  # es el 1000, pon UID y GID en `.env` (`id -u`, `id -g`).
  user: "${UID:-1000}:${GID:-1000}"
  restart: unless-stopped
  volumes:
    - .:/app
  environment:
    # Credenciales ficticias que solo valen contra estos contenedores.
    DJANGO_SECRET_KEY: clave-solo-para-desarrollo-local-no-usar-fuera-de-aqui
    DJANGO_DEBUG: "True"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    # Por la red de compose: `postgres` y `minio` son nombres de servicio, no
    # `localhost`, que dentro del contenedor es el propio contenedor.
    DATABASE_URL: postgres://${POSTGRES_USER:-smartfood}:${POSTGRES_PASSWORD:-smartfood-local}@postgres:5432/${POSTGRES_DB:-smartfood}
    # Conexiones NO persistentes. `runserver` atiende cada petición en un hilo
    # nuevo, y con conexiones persistentes cada hilo deja la suya abierta al
    # morir: el healthcheck, cada 5 s, agotaba las 100 de PostgreSQL en unos
    # veinte minutos y todo lo demás recibía «too many clients already».
    DJANGO_CONN_MAX_AGE: "0"
    EMAIL_URL: consolemail://
    DJANGO_DEFAULT_FROM_EMAIL: SmartFood <onboarding@resend.dev>
    S3_ENDPOINT_URL: http://minio:9000
    # El navegador no resuelve `minio`: las URL firmadas de las fotografías se
    # firman contra el puerto publicado (config/almacenamiento.py, DT-37).
    S3_ENDPOINT_URL_PUBLICO: http://localhost:${MINIO_API_PORT:-9000}
    S3_BUCKET: ${S3_BUCKET:-smartfood}
    S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-smartfood}
    S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-smartfood-local}
    S3_REGION: auto
    S3_ADDRESSING_STYLE: path
    # `sembrar` no tiene contraseña por defecto en el código (DEC-11): se la
    # da este fichero, y es la de `[S2.1]` de docs/desarrollo.md. Vacía, no
    # siembra.
    SEMBRAR_CONTRASENA: ${SEMBRAR_CONTRASENA-smartfood-local-2026}
    SEMBRAR_ESTUDIANTES: ${SEMBRAR_ESTUDIANTES:-12}

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: smartfood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartfood}
      POSTGRES_USER: ${POSTGRES_USER:-smartfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartfood-local}
      # Comparaciones y ordenación en español, que es el idioma de los datos.
      POSTGRES_INITDB_ARGS: "--locale=es_CO.UTF-8 --encoding=UTF8"
      LANG: es_CO.utf8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartfood} -d ${POSTGRES_DB:-smartfood}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: smartfood-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartfood}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartfood-local}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # consola web
    volumes:
      - minio-datos:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Crea el bucket y sale (TT-50). Sin esto, cada integrante tendría que entrar
  # a la consola de MinIO a mano y el entorno dejaría de ser reproducible.
  #
  # UN bucket con dos prefijos, `privado/` y `publico/`, no dos buckets: los
  # buckets de Railway son privados sin excepción y no existe modo público en
  # ningún plan, así que la separación por política que preveía DT-18 no es
  # realizable allí. Se replica aquí la misma topología, porque la razón de usar
  # MinIO en local es la paridad de control de acceso (DT-18, DT-21).
  minio-inicializar:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: smartfood-minio-inicializar
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartfood}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartfood-local}
      BUCKET: ${S3_BUCKET:-smartfood}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      mc mb --ignore-existing local/$$BUCKET;
      mc anonymous set none local/$$BUCKET;
      echo 'Bucket' $$BUCKET 'listo, privado.';
      "
    restart: "no"

  # Compila las dos hojas de Tailwind (DT-36) y se queda vigilando las
  # plantillas. Es el `tailwind watch` de la segunda terminal, ya abierto.
  estilos:
    <<: *aplicacion
    container_name: smartfood-estilos
    # La imagen la construye `app`, que siempre se construye antes de crear
    # ningún contenedor. Construirla aquí también la etiquetaría dos veces con
    # etiquetas de servicio distintas: la imagen cambiaría en cada `up` según
    # cuál terminara último, y los contenedores se recrearían sin motivo.
    pull_policy: never
    command: ["bash", "docker/vigilar-estilos.sh"]
    healthcheck:
      # Listo cuando las dos hojas están compiladas: antes, la aplicación se
      # serviría sin estilos y parecería un fallo de Tailwind que no lo es.
      test: ["CMD", "test", "-f", "/tmp/estilos-listos"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 5s

  # La aplicación: migra, sincroniza los permisos, siembra y sirve (DT-37).
  # El repositorio va montado encima de /app, así que un cambio en el código
  # recarga `runserver` sin reconstruir nada.
  app:
    <<: *aplicacion
    container_name: smartfood-app
    command: ["sh", "docker/arrancar-aplicacion.sh"]
    build:
      context: .
      # Sin atestación de procedencia: lleva la hora de construcción, así que la
      # imagen saldría distinta en cada `up` aunque ninguna capa cambiara.
      # `false` no sirve: Compose lo trata como «sin valor» y buildx pone la suya.
      provenance: "disabled=true"
    # Reconstruye en cada `up`. Con la caché de capas tarda un par de segundos
    # si nada cambió, y es lo que impide levantar una imagen vieja después de
    # un `git pull` que añadió una dependencia a `uv.lock`.
    pull_policy: build
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-inicializar:
        condition: service_completed_successfully
      estilos:
        condition: service_healthy
    healthcheck:
      # `/salud/` comprueba que la base contesta, no solo que el proceso vive
      # (TT-04). El primer arranque siembra y tarda: de ahí el margen.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/salud/', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  postgres-datos:
  minio-datos:
